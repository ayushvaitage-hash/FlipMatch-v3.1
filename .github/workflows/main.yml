name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2
      - run: unzip -q FlipMatch_v3.zip
      - run: cd FlipMatch_v3 && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FlipMatch-APK
          path: FlipMatch_v3/app/build/outputs/apk/debug/app-debug.apk
